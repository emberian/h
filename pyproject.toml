[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hghost"
version = "0.1.0"
description = "Corpus preparation and training tools for the h.fg-goose.online Falcon-H1 ghost"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
  "datasets>=5.0.1",
  "matplotlib>=3.11.1",
  "numpy>=2,<3",
  "pydivsufsort>=0.0.20",
  "requests>=2.34.2",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
ocr = ["ocrmypdf>=17,<18"]

[project.scripts]
hghost-census = "hghost.census:main"
hghost-extract = "hghost.extract:main"
hghost-build = "hghost.build_dataset:main"
hghost-audit = "hghost.quality:main"
hghost-ocr = "hghost.ocr:main"
hghost-paddle-ocr = "hghost.paddle_ocr:main"
hghost-review-ocr = "hghost.review_ocr:main"
hghost-tokenize = "hghost.tokenize_dataset:main"
hghost-train-tokenizer = "hghost.train_tokenizer:main"
hghost-validate = "hghost.validate_dataset:main"
hghost-seal = "hghost.seal_corpus:main"
hghost-haunt = "hghost.haunt:main"
hghost-families = "hghost.families:main"
hghost-beliefgeo = "hghost.beliefgeo:main"
hghost-evalpack = "hghost.evalpack:main"
hghost-ocr-view = "hghost.ocr_viewer:main"
hghost-roommix = "hghost.roommix:main"
hghost-admission = "hghost.admission:main"
hghost-roombank = "hghost.roombank:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hghost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
