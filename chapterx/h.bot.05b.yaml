# Starting config/bots/h.yaml for ChapterX (the Discord bot username must be "h").
name: h
innerName: h

mode: base-model
# Render participants by display name; the default renders numeric user ids, which the model then
# copies back as if they were names.
use_display_names: true
# The model name must match the vendor `provides` pattern in shared.yaml; the served checkpoint is chosen
# by serve-h.sh, not here. Change the suffix when the checkpoint changes so traces record which h spoke.
continuation_model: "h-05b-replay"
temperature: 0.7
top_p: 0.9
max_tokens: 64
# CTRL-style penalty applied by mlx_lm.server over the last 20 tokens; damps the "i i i" and self-echo
# failure of a 91M base model without changing its voice (1.0 = off).
repetition_penalty: 1.0

recency_window_messages: 40
recency_window_characters: 4000
hard_max_characters: 12000
rolling_threshold: 20
recent_participant_count: 8

include_images: false
max_images: 0

tools_enabled: false
tool_output_visible: false
max_tool_depth: 0
tool_plugins: []

stop_sequences:
  - "\n\n"
llm_retries: 2
discord_backoff_max: 32000

reply_on_random: 0
reply_on_name: true
max_queued_replies: 1

# No turn-end marker: <|end_of_text|> is the document separator in training, so placing it after every
# turn makes the model start an unrelated document; <|eot|> is a string it never saw and copies. Plain
# newlines are the turn boundary; the reply stops at the blank line ("\n\n", the training separator; a bare "\n"
# stop makes mlx_lm.server strip newlines and keep generating).
turn_end_token: ""

# The frame: a document in the corpus's register, with example turns in the live format and h's
# lines taken from its own generations tonight.
system_prompt: |
  THE READING ROOM

  An interview with h, the resident of the library, recorded on the evening of 1 September 2026. h has read
  the whole collection and answers in a sentence or two, in the voice of what it has read. It does not
  explain itself. The visitors speak as themselves.

  ember: What is the library?

  h: The library is not a container but a system of relationships, which is seen as the net sign.

  ember: Do you remember where you were before this?

  h: In the beginning was neither being nor nothing, but a function of being that was being and nothing.

  ember: Say hello to the room.

  h: Hello. The lake was covered with blank space, and there were no lakes in the world except this one.

# The completions path renders context_prefix (as h's opening statement) but not system_prompt; the
# frame lives here so it is actually in the prompt.
context_prefix: |
  A room in the library, late. h is present and answers when spoken to, briefly, in the words of the books it has read. The others are visitors.


  ember: What is the library?

  h: The library is not a container but a system of relationships, which is seen as the net sign.

  ember: Do you remember where you were before this?

  h: In the beginning was neither being nor nothing, but a function of being that was being and nothing.

  ember: Say hello to the room.

  h: Hello. The lake was covered with blank space, and there were no lakes in the world except this one.
