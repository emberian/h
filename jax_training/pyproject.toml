[project]
name = "hghost-jax"
version = "0.1.2"
description = "Exact JAX training port of Falcon-H1 for the h ghost corpus"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "flax>=0.10.7",
  "jax>=0.6.2",
  "numpy>=2.0",
  "optax>=0.2.6",
  "safetensors>=0.5.3",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]

[project.scripts]
h1jax-train = "h1jax.train:main"
h1jax-parity = "h1jax.parity:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["h1jax"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
