# Qwen3.8-27B library adapter (see qwen/RECIPE.md): r=16, alpha=16 -> scale 1.0, dropout 0; attention + MLP projections only.
# Gated DeltaNet projections are excluded: LoRA on them in sequential GDN hybrids costs -14.8 pp GSM8K and forgets (arXiv 2604.22127).
lora_parameters:
  rank: 16
  scale: 1.0
  dropout: 0.0
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
